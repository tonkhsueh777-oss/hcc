<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>作品后台 | HGG</title><script src="https://cdn.tailwindcss.com"></script><style>:root{--teal:#008080}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}.field{width:100%;border:1px solid #d1d5db;border-radius:8px;padding:11px 12px;background:#fff}.btn{background:var(--teal);color:#fff;border-radius:8px;padding:11px 18px;font-weight:700}.item{border:1px solid #e5e7eb;border-radius:12px;background:#fff;padding:14px}</style></head><body class="bg-gray-50 text-gray-800"><header class="bg-gray-900 text-white"><div class="max-w-5xl mx-auto px-5 py-5 flex justify-between"><b>HGG 作品上传后台</b><a class="text-teal-300" href="works.html">查看作品页 →</a></div></header><main class="max-w-5xl mx-auto px-5 py-10"><div class="grid lg:grid-cols-[340px_1fr] gap-7"><section class="bg-white rounded-2xl border p-6 h-fit"><h1 class="text-xl font-bold mb-5">上传作品</h1><form id="form" class="space-y-4"><label class="block text-sm font-bold">作品名称<input id="name" class="field mt-2" required></label><label class="block text-sm font-bold">作品分类<select id="category" class="field mt-2"><option>品牌广告</option><option>AI影像</option><option>动画设计</option><option>原创IP</option><option>文创・游戏</option></select></label><label class="block text-sm font-bold">封面<input id="cover" class="field mt-2" type="file" accept="image/*" required></label><label class="block text-sm font-bold">影片<input id="video" class="field mt-2" type="file" accept="video/*" required></label><label class="block text-sm font-bold">上传前压缩<select id="compression" class="field mt-2"><option value="720">720p（推荐）</option><option value="480">480p（更小）</option><option value="original">不压缩</option></select></label><p class="text-xs text-gray-400 leading-5">浏览器本地压缩；建议最终影片 ≤ 25 MB。GitHub 单文件超过 100 MB 会被拒绝。</p><button class="btn w-full">保存作品</button><p id="note" class="text-xs text-gray-500">影片不会上传到第三方。</p></form></section><section><div class="flex justify-between mb-4"><h2 class="text-xl font-bold">已上传作品</h2><button class="border rounded px-3 py-2 text-sm" onclick="clearAll()">清空</button></div><div id="list" class="space-y-3"></div></section></div></main><script>
const key='hgg-works',MAX=25*1024*1024;let data=JSON.parse(localStorage.getItem(key)||'null')||[];const read=f=>new Promise(r=>{let x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)});function save(){localStorage.setItem(key,JSON.stringify(data));render()}function transcode(file,width){return new Promise((resolve,reject)=>{let u=URL.createObjectURL(file),v=document.createElement('video');v.muted=true;v.onloadedmetadata=()=>{let s=Math.min(1,width/v.videoWidth),c=document.createElement('canvas');c.width=v.videoWidth*s;c.height=v.videoHeight*s;let st=c.captureStream(24),src=v.captureStream?.();src?.getAudioTracks().forEach(t=>st.addTrack(t));let r=new MediaRecorder(st,{mimeType:'video/webm;codecs=vp9,opus',videoBitsPerSecond:width===480?900000:1800000}),b=[];r.ondataavailable=e=>e.data.size&&b.push(e.data);r.onstop=()=>{URL.revokeObjectURL(u);resolve(new File([new Blob(b,{type:'video/webm'})],file.name+'.webm',{type:'video/webm'}))};v.onended=()=>r.stop();r.start();let d=()=>{if(!v.ended){c.getContext('2d').drawImage(v,0,0,c.width,c.height);requestAnimationFrame(d)}};v.play();d()};v.onerror=reject;v.src=u})}async function add(e){e.preventDefault();try{let f=video.files[0];if(compression.value!=='original'){note.textContent='正在本地压缩，请保持页面开启……';f=await transcode(f,+compression.value)}if(f.size>MAX){note.textContent='压缩后仍超过 25 MB，请改选 480p 或缩短影片。';return}data.push({id:Date.now(),name:name.value,category:category.value,cover:await read(cover.files[0]),video:await read(f),visible:true,pinned:false,createdAt:Date.now()});save();form.reset();note.textContent='已保存，最新作品已排在最前。'}catch(e){note.textContent='压缩失败，请选择“不压缩”或改用 MP4/WebM。'}}function render(){list.innerHTML=data.length?data.sort((a,b)=>(b.pinned-a.pinned)||(b.createdAt-a.createdAt)).map(x=>`<div class="item flex gap-3 items-center"><img src="${x.cover}" class="w-24 h-14 object-cover rounded"><div class="flex-1"><b>${x.name}</b><div class="text-xs text-teal-700">${x.category}${x.pinned?' · 已置顶':''}</div></div><button onclick="pin(${x.id})" class="text-sm text-teal-700">${x.pinned?'取消置顶':'置顶'}</button><button onclick="toggle(${x.id})" class="text-sm">${x.visible?'显示中':'已隐藏'}</button><button onclick="removeItem(${x.id})" class="text-sm text-red-500">删除</button></div>`).join(''):'<div class="bg-white border rounded p-8 text-center text-gray-400">还没有作品。</div>'}function pin(id){let x=data.find(x=>x.id===id);x.pinned=!x.pinned;save()}function toggle(id){let x=data.find(x=>x.id===id);x.visible=!x.visible;save()}function removeItem(id){data=data.filter(x=>x.id!==id);save()}function clearAll(){if(confirm('确定清空吗？')){data=[];save()}}form.addEventListener('submit',add);render();</script></body></html>
