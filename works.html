<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>作品展示｜柚信使传媒有限公司 HGG</title><script src="https://cdn.tailwindcss.com"></script><style>:root{--teal:#008080}*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}.filter{border:1px solid #475569;border-radius:999px;padding:.6rem 1rem;background:transparent;color:#cbd5e1;font-size:.85rem;font-weight:700;white-space:nowrap;transition:.2s}.filter.active,.filter:hover{background:#14b8a6;border-color:#14b8a6;color:#062d2b}.work-card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 12px 35px #0f172a12;border:1px solid #e5e7eb;transition:.25s}.work-card:hover{transform:translateY(-5px);box-shadow:0 20px 42px #0f172a20}.work-card video{aspect-ratio:16/10;object-fit:cover;width:100%;background:#0f172a}.brand-mark{letter-spacing:.12em}</style></head><body class="bg-gray-50 text-gray-800"><header class="bg-slate-950 text-white"><div class="max-w-7xl mx-auto px-5 py-5 flex items-center justify-between"><div class="flex items-center gap-4"><img src="images/logo_header.png" class="h-9" alt="HGG Logo"><div class="border-l border-slate-700 pl-4"><div class="font-bold">柚信使传媒有限公司</div><div class="text-xs text-teal-300 brand-mark">HGG MEDIA</div></div></div><span class="hidden sm:block text-xs tracking-[.28em] text-slate-400">WORKS / 作品集</span></div></header><section class="bg-slate-950 text-white"><div class="max-w-7xl mx-auto px-5 pt-16 pb-20"><div class="max-w-3xl"><p class="text-teal-300 text-sm font-bold tracking-[.22em]">HGG MEDIA PORTFOLIO</p><h1 class="mt-5 text-4xl md:text-6xl font-bold leading-tight">把想像力，变成<br><span class="text-teal-300">看得见的影像。</span></h1><p class="mt-6 text-slate-300 text-lg leading-8">柚信使传媒有限公司｜影像、动画与原创内容作品展示。</p></div></div></section><main class="max-w-7xl mx-auto px-5 py-14"><div id="filters" class="flex gap-2 overflow-x-auto pb-2 mb-10"></div><div id="works" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-7"></div><div id="empty" class="hidden text-center py-24 text-gray-400">这个分类还没有作品。</div></main><footer class="bg-slate-950 text-slate-400 py-10 text-center"><img src="images/logo_footer.png" class="h-10 mx-auto mb-4" alt="HGG Logo"><p class="font-bold text-slate-200">柚信使传媒有限公司</p><p class="text-xs mt-2">HGG Media · © 2026</p></footer><script>
const cats=['全部','品牌广告','AI影像','动画设计','原创IP','文创・游戏'];const seed=[['品牌形象广告','品牌广告','images/work_01.jpg','images/work_01.mp4'],['AI 专项评估','AI影像','images/work_02.jpg','images/work_02.mp4'],['产品结构演示','动画设计','images/work_03.jpg','images/work_03.mp4'],['品牌故事短片','品牌广告','images/work_04.jpg','images/work_04.mp4'],['资讯解说视频','AI影像','images/work_05.jpg','images/work_05.mp4'],['HGG 原创 IP 动画','原创IP','images/work_06.jpg','images/work_06.mp4']];const stored=JSON.parse(localStorage.getItem('hgg-works')||'null');const data=stored||seed.map((x,i)=>({id:i+1,name:x[0],category:x[1],cover:x[2],video:x[3],visible:true,pinned:false,createdAt:Date.now()-i}));let current='全部';function draw(){filters.innerHTML=cats.map(c=>`<button class="filter ${c===current?'active':''}" onclick="current='${c}';draw()">${c}</button>`).join('');const list=data.filter(x=>x.visible!==false&&(current==='全部'||x.category===current)).sort((a,b)=>(b.pinned-a.pinned)||(b.createdAt-a.createdAt));empty.classList.toggle('hidden',list.length>0);works.innerHTML=list.map(x=>`<article class="work-card"><video controls preload="metadata" poster="${x.cover}"><source src="${x.video}"></video><div class="p-5"><div class="text-xs text-teal-700 font-bold mb-2">${x.pinned?'置顶 · ':''}${x.category}</div><h2 class="font-bold text-lg">${x.name}</h2></div></article>`).join('')}draw();</script></body></html>
